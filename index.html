<!DOCTYPE html>
<html lang="ar" dir="rtl">

    <title>مفاجأة عيد الميلاد 18</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <canvas id="fireworks-canvas"></canvas>

        <!-- قم بتغيير رابط الصورة هنا إلى صورتك الخاصة -->
        <img id="celebration-img" src="https://images.unsplash.com/photo-1530103862676-de8c9debad1d?auto=format&fit=crop&w=600&q=80" alt="عيد ميلاد سعيد">
        <div id="birthday-text">Happy Birthday 18! 🎉</div>
    </div>

    <script src="script.js"></script>
